[package]
name = "notifyer"
version = "0.1.0"
description = "Quick notes to Obsidian and reminders"
authors = ["Notifyer contributors"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
name = "notifyer_lib"
# Desktop only: staticlib/cdylib are needed just for mobile targets and weigh ~700 MB in debug.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "System",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Win32_Graphics_Dwm",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
] }
windows-numerics = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
